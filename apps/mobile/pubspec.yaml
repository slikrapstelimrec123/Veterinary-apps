name: vet_care_mobile
description: Pet owner mobile app for the veterinary care platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  app_links: ^6.4.1
  archive: ^4.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.15.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  in_app_purchase: 3.2.3
  in_app_purchase_android: 0.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  pdfrx: ^2.4.7
  share_plus: ^10.1.4
  flutter_svg: ^2.0.9
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/lappo_app_icon_dark_1024.png"
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/lappo_app_icon_dark_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
  assets:
    - assets/
    - assets/icons/
    - assets/fonts/OFL-Montserrat.txt
