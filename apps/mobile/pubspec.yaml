name: vet_care_mobile
description: Pet owner mobile app for the veterinary care platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.6.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.9

dependency_overrides:
  supabase_flutter: 2.6.0
  app_links: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/





