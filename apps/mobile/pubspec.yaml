name: vet_care_mobile
description: Pet owner mobile app for the veterinary care platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  app_links: ^6.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.15.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.9
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/lappo_app_icon_dark_1024.png"
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/lappo_app_icon_dark_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
  assets:
    - assets/
    - assets/icons/
    - assets/fonts/OFL-Montserrat.txt
